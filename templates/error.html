<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>404 - Page Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="text-center">
    <h1 class="text-6xl font-bold text-red-500">404</h1>
    <p class="text-2xl text-gray-700 mt-4">Oops! The page you're looking for doesn't exist.</p>
    <p class="text-md text-gray-500 mt-2">You'll be redirected to the home page in <span id="countdown">10</span> seconds.</p>
    
    <a href="/" class="mt-6 inline-block bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
      Go Back Home
    </a>
  </div>

  <script>
    let countdown = 10;
    const countdownElement = document.getElementById('countdown');
    const interval = setInterval(() => {
      countdown--;
      countdownElement.textContent = countdown;
      if (countdown === 0) {
        clearInterval(interval);
        window.location.href = '/'; // Redirect to home page
      }
    }, 1000);
  </script>

</body>
</html>
